<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS Controls - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-dark">
    <!-- Painel de Controles TTS -->
    <div class="tts-controls-panel" id="controls-panel">
        <h3>🎛️ Controles TTS</h3>
        <div class="control-group">
            <button id="pause-btn" class="control-btn">⏸️ Pausar</button>
            <button id="skip-btn" class="control-btn">⏭️ Pular</button>
            <button id="clear-btn" class="control-btn">🗑️ Limpar Fila</button>
        </div>
        <div class="control-group">
            <label>Volume: <span id="volume-value">100</span>%</label>
            <input type="range" id="volume-slider" min="0" max="100" value="100" class="slider">
        </div>
        <div class="control-group">
            <label>Fila: <span id="queue-size">0</span> mensagens</label>
        </div>
        <div class="control-group">
            <label>Status: <span id="tts-status">Ligado</span></label>
        </div>
    </div>

    <!-- Dashboard de Estatísticas -->
    <div class="stats-panel" id="stats-panel">
        <h3>📊 Estatísticas</h3>
        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-value" id="stat-total">0</div>
                <div class="stat-label">Total Mensagens</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="stat-users">0</div>
                <div class="stat-label">Usuários Únicos</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="stat-uptime">0h 0m</div>
                <div class="stat-label">Uptime</div>
            </div>
        </div>
        <div class="stats-actions">
            <button id="export-json-btn" class="export-btn">📥 Exportar JSON</button>
            <button id="export-csv-btn" class="export-btn">📥 Exportar CSV</button>
        </div>
    </div>

    <!-- Painel de Mensagens -->
    <div class="messages-panel" id="messages-panel">
        <h3>📝 Mensagens Capturadas</h3>
        <div id="messages-container">
            <div class="no-messages">Aguardando mensagens...</div>
        </div>
    </div>

    <!-- Usuários Online -->
    <div class="users-panel" id="users-panel">
        <h3>👥 Usuários Online (<span id="users-count">0</span>)</h3>
        <div id="users-list" class="users-list">
            <div class="no-users">Carregando...</div>
        </div>
    </div>

    <!-- Configurações -->
    <div class="settings-panel" id="settings-panel">
        <h3>⚙️ Configurações</h3>
        <div class="setting-item">
            <label>Tema:</label>
            <select id="theme-select">
                <option value="dark">Escuro</option>
                <option value="light">Claro</option>
            </select>
        </div>
        <div class="setting-item">
            <label>Tamanho da Fonte:</label>
            <input type="range" id="font-size-slider" min="10" max="20" value="12" class="slider">
            <span id="font-size-value">12px</span>
        </div>
        <div class="setting-item">
            <label>
                <input type="checkbox" id="compact-mode"> Modo Compacto
            </label>
        </div>
    </div>

    <script src="controls.js"></script>
</body>
</html>
