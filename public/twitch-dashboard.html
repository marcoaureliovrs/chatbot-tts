<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch Dashboard - Relatórios</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: rgba(0, 0, 0, 0.95);
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(145, 70, 255, 0.2);
            border-radius: 10px;
            border: 2px solid #9146ff;
        }

        .dashboard-header h1 {
            color: #9146ff;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .dashboard-card {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #9146ff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(145, 70, 255, 0.3);
        }

        .dashboard-card h2 {
            color: #9146ff;
            font-size: 20px;
            margin-bottom: 15px;
            border-bottom: 2px solid #9146ff;
            padding-bottom: 10px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(145, 70, 255, 0.2);
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #999;
            font-size: 14px;
        }

        .stat-value {
            color: #fff;
            font-size: 16px;
            font-weight: bold;
        }

        .stat-value.highlight {
            color: #9146ff;
            font-size: 24px;
        }

        .stream-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .stream-status.live {
            background: #00ff00;
            color: #000;
        }

        .stream-status.offline {
            background: #666;
            color: #fff;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .error {
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff0000;
            color: #ff0000;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .refresh-btn {
            background: #9146ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: #772ce8;
            transform: scale(1.05);
        }

        .subscriber-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .subscriber-item {
            padding: 8px;
            margin: 5px 0;
            background: rgba(145, 70, 255, 0.1);
            border-radius: 5px;
            border-left: 3px solid #9146ff;
        }

        .game-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .game-icon {
            width: 50px;
            height: 50px;
            border-radius: 5px;
            object-fit: cover;
        }

        .timestamp {
            color: #999;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="dashboard-header">
        <h1>📊 Twitch Dashboard - Relatórios</h1>
        <p>Informações completas do seu canal na Twitch</p>
        <button class="refresh-btn" onclick="loadDashboard()">🔄 Atualizar</button>
        <a href="/" style="color: #9146ff; text-decoration: none; margin-left: 10px;">← Voltar</a>
    </div>

    <div id="loading" class="loading">
        <p>Carregando dados...</p>
    </div>

    <div id="error-container"></div>

    <div id="dashboard-content" style="display: none;">
        <div class="dashboard-grid">
            <!-- Informações do Usuário -->
            <div class="dashboard-card">
                <h2>👤 Informações do Canal</h2>
                <div id="user-info"></div>
            </div>

            <!-- Status do Stream -->
            <div class="dashboard-card">
                <h2>📺 Status do Stream</h2>
                <div id="stream-info"></div>
            </div>

            <!-- Estatísticas Gerais -->
            <div class="dashboard-card">
                <h2>📈 Estatísticas Gerais</h2>
                <div id="general-stats"></div>
            </div>

            <!-- Informações do Canal -->
            <div class="dashboard-card">
                <h2>⚙️ Configurações do Canal</h2>
                <div id="channel-info"></div>
            </div>

            <!-- Subscribers -->
            <div class="dashboard-card">
                <h2>⭐ Subscribers (<span id="sub-count">0</span>)</h2>
                <div id="subscribers-info" class="subscriber-list"></div>
            </div>

            <!-- Analytics -->
            <div class="dashboard-card">
                <h2>📊 Analytics</h2>
                <div id="analytics-info"></div>
            </div>
        </div>
    </div>

    <script>
        async function loadDashboard() {
            const loading = document.getElementById('loading');
            const content = document.getElementById('dashboard-content');
            const errorContainer = document.getElementById('error-container');
            
            loading.style.display = 'block';
            content.style.display = 'none';
            errorContainer.innerHTML = '';

            try {
                const response = await fetch('/api/twitch/dashboard');
                
                // Verifica o tipo de conteúdo da resposta
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    // Se não for JSON, provavelmente é HTML (página de erro)
                    const text = await response.text();
                    throw new Error('Servidor retornou resposta inválida. Verifique se o servidor está rodando corretamente.');
                }

                const data = await response.json();

                // Verifica se há erro de autenticação
                if (data.error && data.requiresAuth) {
                    showAuthError(data);
                    loading.style.display = 'none';
                    return;
                }

                if (!response.ok && !data.success) {
                    throw new Error(data.message || data.error || 'Erro ao carregar dados');
                }

                if (data.success === false || (data.error && !data.success)) {
                    showAuthError(data);
                    loading.style.display = 'none';
                    return;
                }

                // Se chegou aqui, os dados estão OK
                displayDashboard(data);
                loading.style.display = 'none';
                content.style.display = 'block';
            } catch (error) {
                loading.style.display = 'none';
                
                // Trata erros de parsing JSON
                if (error.message.includes('Unexpected token') || error.message.includes('JSON')) {
                    errorContainer.innerHTML = `
                        <div class="error">
                            <strong>Erro de Comunicação:</strong> O servidor retornou uma resposta inválida.
                            <br><br>
                            <p>Possíveis causas:</p>
                            <ul style="text-align: left; margin: 10px 0;">
                                <li>Servidor não está rodando</li>
                                <li>Rota da API não existe</li>
                                <li>Erro no servidor</li>
                            </ul>
                            <br>
                            <button class="refresh-btn" onclick="loadDashboard()">
                                🔄 Tentar Novamente
                            </button>
                            <button class="refresh-btn" onclick="window.location.href='/auth/login'" style="background: #9146ff;">
                                🔐 Verificar Login
                            </button>
                            <a href="/" style="color: #9146ff; text-decoration: none; margin-left: 10px;">← Voltar</a>
                        </div>
                    `;
                } else {
                    errorContainer.innerHTML = `
                        <div class="error">
                            <strong>Erro:</strong> ${error.message}
                            <br><br>
                            <button class="refresh-btn" onclick="loadDashboard()">
                                🔄 Tentar Novamente
                            </button>
                            <button class="refresh-btn" onclick="window.location.href='/auth/login'" style="background: #9146ff;">
                                🔐 Fazer Login / Solicitar Permissões
                            </button>
                            <a href="/" style="color: #9146ff; text-decoration: none; margin-left: 10px;">← Voltar</a>
                        </div>
                    `;
                }
            }
        }

        function showAuthError(data) {
            const errorContainer = document.getElementById('error-container');
            
            let message = data.message || 'Acesso não autorizado';
            let details = '';
            
            if (data.error === 'NO_TOKEN') {
                message = 'Você precisa fazer login para acessar o dashboard';
                details = 'Nenhum token de autenticação foi encontrado. Clique no botão abaixo para fazer login e conceder as permissões necessárias.';
            } else if (data.error === 'INVALID_TOKEN') {
                message = 'Sessão expirada ou token inválido';
                details = 'Seu token de autenticação expirou ou é inválido. Por favor, faça login novamente.';
            } else if (data.error === 'AUTH_ERROR') {
                message = 'Erro de autenticação';
                details = data.message || 'Não foi possível autenticar com a Twitch. Tente fazer login novamente.';
            } else {
                details = 'Não foi possível acessar os dados da Twitch. Verifique se você concedeu todas as permissões necessárias.';
            }

            errorContainer.innerHTML = `
                <div class="error" style="background: rgba(255, 193, 7, 0.2); border-color: #ffc107; color: #ffc107;">
                    <h3 style="margin-bottom: 15px; color: #ffc107;">⚠️ ${message}</h3>
                    <p style="margin-bottom: 20px; line-height: 1.6;">${details}</p>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <button class="refresh-btn" onclick="window.location.href='/auth/login'" style="background: #9146ff;">
                            🔐 Fazer Login / Solicitar Permissões
                        </button>
                        <button class="refresh-btn" onclick="loadDashboard()" style="background: #666;">
                            🔄 Tentar Novamente
                        </button>
                        <a href="/" style="color: #9146ff; text-decoration: none; padding: 10px 20px; border: 2px solid #9146ff; border-radius: 5px; display: inline-block;">
                            ← Voltar para Página Principal
                        </a>
                    </div>
                    <div style="margin-top: 20px; padding: 15px; background: rgba(0, 0, 0, 0.3); border-radius: 5px; font-size: 12px;">
                        <strong>Permissões necessárias:</strong>
                        <ul style="margin-top: 10px; padding-left: 20px;">
                            <li>user:read:email - Para ver informações do perfil</li>
                            <li>channel:read:stream_key - Para ver informações do canal</li>
                            <li>channel:read:subscriptions - Para ver lista de subscribers</li>
                            <li>analytics:read:extensions - Para ver analytics (opcional)</li>
                        </ul>
                    </div>
                </div>
            `;
        }

        function displayDashboard(data) {
            // Informações do Usuário
            const userInfo = document.getElementById('user-info');
            userInfo.innerHTML = `
                <div class="stat-item">
                    <span class="stat-label">Nome:</span>
                    <span class="stat-value">${escapeHtml(data.user?.display_name || 'N/A')}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Username:</span>
                    <span class="stat-value">@${escapeHtml(data.user?.login || 'N/A')}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">ID:</span>
                    <span class="stat-value">${escapeHtml(data.user?.id || 'N/A')}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Email:</span>
                    <span class="stat-value">${escapeHtml(data.user?.email || 'Não disponível')}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Criado em:</span>
                    <span class="stat-value">${formatDate(data.user?.created_at)}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Descrição:</span>
                    <span class="stat-value" style="font-size: 12px; max-width: 200px; word-wrap: break-word;">${escapeHtml(data.user?.description || 'Sem descrição')}</span>
                </div>
            `;

            // Status do Stream
            const streamInfo = document.getElementById('stream-info');
            if (data.stream) {
                streamInfo.innerHTML = `
                    <div class="stat-item">
                        <span class="stat-label">Status:</span>
                        <span class="stream-status live">🔴 AO VIVO</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Título:</span>
                        <span class="stat-value">${escapeHtml(data.stream.title)}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Jogo:</span>
                        <span class="stat-value">${escapeHtml(data.stream.game_name || 'N/A')}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Viewers:</span>
                        <span class="stat-value highlight">${data.stream.viewer_count || 0}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Iniciado em:</span>
                        <span class="stat-value">${formatDate(data.stream.started_at)}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Tipo:</span>
                        <span class="stat-value">${data.stream.type || 'N/A'}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Idioma:</span>
                        <span class="stat-value">${data.stream.language || 'N/A'}</span>
                    </div>
                `;
            } else {
                streamInfo.innerHTML = `
                    <div class="stat-item">
                        <span class="stat-label">Status:</span>
                        <span class="stream-status offline">⚫ OFFLINE</span>
                    </div>
                    <p style="color: #999; margin-top: 10px;">Nenhum stream ativo no momento.</p>
                `;
            }

            // Estatísticas Gerais
            const generalStats = document.getElementById('general-stats');
            generalStats.innerHTML = `
                <div class="stat-item">
                    <span class="stat-label">Seguidores:</span>
                    <span class="stat-value highlight">${formatNumber(data.followers || 0)}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Subscribers:</span>
                    <span class="stat-value highlight">${formatNumber(data.subscribers?.total || 0)}</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Viewers Atuais:</span>
                    <span class="stat-value highlight">${data.stream?.viewer_count || 0}</span>
                </div>
            `;

            // Informações do Canal
            const channelInfo = document.getElementById('channel-info');
            if (data.channel) {
                channelInfo.innerHTML = `
                    <div class="stat-item">
                        <span class="stat-label">Título do Canal:</span>
                        <span class="stat-value">${escapeHtml(data.channel.title || 'N/A')}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Jogo/Categoria:</span>
                        <span class="stat-value">${escapeHtml(data.channel.game_name || 'N/A')}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Idioma:</span>
                        <span class="stat-value">${escapeHtml(data.channel.broadcaster_language || 'N/A')}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Delay:</span>
                        <span class="stat-value">${data.channel.delay || 0}s</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Conteúdo Adequado:</span>
                        <span class="stat-value">${data.channel.is_branded_content ? 'Sim' : 'Não'}</span>
                    </div>
                `;
            } else {
                channelInfo.innerHTML = '<p style="color: #999;">Informações do canal não disponíveis.</p>';
            }

            // Subscribers
            const subscribersInfo = document.getElementById('subscribers-info');
            const subCount = document.getElementById('sub-count');
            subCount.textContent = data.subscribers?.total || 0;
            
            if (data.subscribers && data.subscribers.data && data.subscribers.data.length > 0) {
                subscribersInfo.innerHTML = data.subscribers.data.map(sub => `
                    <div class="subscriber-item">
                        <strong>${escapeHtml(sub.user_name || 'N/A')}</strong>
                        <br>
                        <small>Tier: ${sub.tier || 'N/A'} | Desde: ${formatDate(sub.gifter_id ? null : sub.created_at)}</small>
                    </div>
                `).join('');
            } else {
                subscribersInfo.innerHTML = '<p style="color: #999;">Nenhum subscriber encontrado.</p>';
            }

            // Analytics
            const analyticsInfo = document.getElementById('analytics-info');
            if (data.analytics && data.analytics.length > 0) {
                analyticsInfo.innerHTML = data.analytics.map(analytics => `
                    <div class="stat-item">
                        <span class="stat-label">${escapeHtml(analytics.extension_id || 'Analytics')}</span>
                        <span class="stat-value">${formatDate(analytics.started_at)}</span>
                    </div>
                `).join('');
            } else {
                analyticsInfo.innerHTML = '<p style="color: #999;">Analytics não disponíveis. Pode ser necessário escopo adicional.</p>';
            }

            // Timestamp
            const timestamp = document.createElement('div');
            timestamp.className = 'timestamp';
            timestamp.textContent = `Última atualização: ${formatDate(data.timestamp)}`;
            document.getElementById('dashboard-content').appendChild(timestamp);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            try {
                const date = new Date(dateString);
                return date.toLocaleString('pt-BR');
            } catch (e) {
                return dateString;
            }
        }

        function formatNumber(num) {
            return new Intl.NumberFormat('pt-BR').format(num);
        }

        // Carrega dashboard ao carregar a página
        window.addEventListener('DOMContentLoaded', loadDashboard);
        
        // Atualiza a cada 30 segundos
        setInterval(loadDashboard, 30000);
    </script>
</body>
</html>
